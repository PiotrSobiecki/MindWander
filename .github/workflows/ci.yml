name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      # Klucze API mieszkają w chrome.storage, nie w źródłach — build nie
      # potrzebuje żadnych sekretów.
      - run: npm run build

      # Pilnuje ujawnienia AI (art. 50 AI Act), tego, że dane z wyszukiwarki
      # nie wracają do innerHTML, i tego, że content.js oraz popup.js ładują
      # się jako klasyczne skrypty. Nie wyłączaj.
      - run: npm test

      - run: npm run validate
